<div class="employee-form-container">

  <div class="form-card">

    <div class="form-header">

      <h1>

        {{ isEditMode
          ? 'Edit Employee'
          : 'Add Employee'
        }}

      </h1>

      <p>

        {{ isEditMode
          ? 'Update employee details'
          : 'Enter employee details'
        }}

      </p>

    </div>

    <form
      [formGroup]="employeeForm"
      (ngSubmit)="submitEmployee()">

      <div class="form-grid">

        <div class="form-group">

          <label>
            Employee Name
          </label>

          <input
            type="text"
            formControlName="employeeName"
            placeholder="Enter employee name">

        </div>

        <div class="form-group">

          <label>
            Employee Code
          </label>

          <input
            type="text"
            formControlName="employeeCode"
            placeholder="Enter employee code">

        </div>

        <div class="form-group">

          <label>
            Email
          </label>

          <input
            type="email"
            formControlName="email"
            placeholder="Enter email">

        </div>

        <div class="form-group">

          <label>
            Phone
          </label>

          <input
            type="text"
            formControlName="phone"
            placeholder="Enter phone number">

        </div>

        <div class="form-group">

          <label>
            Department
          </label>

          <input
            type="text"
            formControlName="department"
            placeholder="Enter department">

        </div>

        <div class="form-group">

          <label>
            Designation
          </label>

          <input
            type="text"
            formControlName="designation"
            placeholder="Enter designation">

        </div>

        <div class="form-group">

          <label>
            Joining Date
          </label>

          <input
            type="date"
            formControlName="joiningDate">

        </div>

        <div class="form-group">

          <label>
            Status
          </label>

          <select
            formControlName="status">

            <option value="ACTIVE">
              ACTIVE
            </option>

            <option value="INACTIVE">
              INACTIVE
            </option>

          </select>

        </div>

      </div>

      <div class="button-container">

        <button
          type="button"
          class="cancel-button"
          (click)="cancel()">

          Cancel

        </button>

        <button
          type="submit"
          class="submit-button">

          {{ isEditMode
            ? 'Update Employee'
            : 'Add Employee'
          }}

        </button>

      </div>

    </form>

  </div>

</div>
