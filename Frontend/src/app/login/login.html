<div class="login-page">

  <div class="login-card">

    <div class="logo">
      IMS
    </div>

    <h1>
      Inventory Management System
    </h1>

    <p class="subtitle">
      Login to continue
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label>
          Username
        </label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
          autocomplete="username"
        >

      </div>

      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
          autocomplete="current-password"
        >

      </div>

      @if (errorMessage) {

        <div class="error-message">

          {{ errorMessage }}

        </div>

      }

      <button
        type="submit"
        class="login-button"
        [disabled]="loading">

        @if (loading) {

          Logging in...

        } @else {

          Login

        }

      </button>

    </form>

  </div>

</div>
